<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="topAccentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <radialGradient id="glowSkyLight" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigoLight" cx="88%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <pattern id="microDotsLight" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#64748B" opacity="0.14" />
    </pattern>

    <clipPath id="cardClipLight">
      <rect x="1" y="1" width="898" height="218" rx="14" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace;
    }
    .pulse {
      animation: pulseDotLight 2.4s ease-in-out infinite;
    }
    @keyframes pulseDotLight {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Card Surface -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgLight)" stroke="#D0D7DE" stroke-width="1" />

  <g clip-path="url(#cardClipLight)">
    <rect x="1" y="1" width="898" height="218" fill="url(#glowSkyLight)" />
    <rect x="1" y="1" width="898" height="218" fill="url(#glowIndigoLight)" />
    <rect x="1" y="1" width="898" height="218" fill="url(#microDotsLight)" />
    <line x1="1" y1="1.75" x2="899" y2="1.75" stroke="url(#topAccentLight)" stroke-width="1.5" />
  </g>

  <!-- Top Row -->
  <g transform="translate(36, 23)">
    <rect x="0" y="0" width="272" height="24" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#16A34A" class="pulse" />
    <text x="25" y="15.5" fill="#334155" class="sans" font-size="11" font-weight="600">Disponible para oportunidades · Sevilla, ES</text>
  </g>

  <text x="864" y="39" text-anchor="end" fill="#64748B" class="mono" font-size="11" font-weight="500">DAW · Ing. Informática (UBU) · @jucagolddev</text>

  <!-- Main Identity -->
  <text x="38" y="102" fill="#0F172A" class="sans" font-size="33" font-weight="800" letter-spacing="-0.6">Juan Carlos Dorado López</text>
  <rect x="38" y="112" width="54" height="2.5" rx="1.25" fill="url(#topAccentLight)" />
  <text x="38" y="138" fill="#475569" class="sans" font-size="14.5" font-weight="500">Frontend &amp; Full-Stack Software Engineer · Angular, TypeScript &amp; Clean Architecture</text>

  <!-- Right Isometric 3-Layer Clean Architecture Emblem -->
  <g transform="translate(744, 62)">
    <line x1="58" y1="18" x2="58" y2="76" stroke="#0284C7" stroke-width="1" stroke-dasharray="2.5,2.5" opacity="0.55" />

    <polygon points="58,4 112,24 58,44 4,24" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="58" cy="24" r="3" fill="#0284C7" />

    <polygon points="58,28 112,48 58,68 4,48" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2" />
    <circle cx="58" cy="48" r="3" fill="#4F46E5" />

    <polygon points="58,52 112,72 58,92 4,72" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2" />
    <circle cx="58" cy="72" r="3" fill="#D97706" />
  </g>

  <!-- Bottom Divider -->
  <line x1="36" y1="164" x2="864" y2="164" stroke="#E2E8F0" stroke-width="1" />

  <!-- Bottom Chips -->
  <g transform="translate(38, 177)" class="sans" font-size="11" font-weight="600">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="144" height="26" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#0284C7" />
      <text x="22" y="16.5" fill="#1E293B">Angular 19+ · Signals</text>
    </g>

    <g transform="translate(154, 0)">
      <rect x="0" y="0" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#0284C7" />
      <text x="22" y="16.5" fill="#1E293B">TypeScript Strict</text>
    </g>

    <g transform="translate(286, 0)">
      <rect x="0" y="0" width="132" height="26" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#4F46E5" />
      <text x="22" y="16.5" fill="#1E293B">Clean Architecture</text>
    </g>

    <g transform="translate(428, 0)">
      <rect x="0" y="0" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#D97706" />
      <text x="22" y="16.5" fill="#1E293B">Three.js · Canvas</text>
    </g>

    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="126" height="26" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#16A34A" />
      <text x="22" y="16.5" fill="#1E293B">Node.js · Firebase</text>
    </g>
  </g>

  <text x="864" y="194" text-anchor="end" fill="#64748B" class="mono" font-size="11" font-weight="600">60 FPS · ES / EN</text>
</svg>
