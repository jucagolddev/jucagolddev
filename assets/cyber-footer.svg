<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f" />
      <stop offset="50%" stop-color="#090b1c" />
      <stop offset="100%" stop-color="#0e1026" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="footerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#7928ca" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Caution Stripe Pattern -->
    <pattern id="footerCaution" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fcee0a" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="5" y1="0" x2="5" y2="10" stroke="#05060f" stroke-width="2.5" stroke-opacity="0.8" />
    </pattern>

    <!-- Subtle Tech Grid -->
    <pattern id="footerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .footer-title {
      font-family: 'Century Gothic', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .footer-mono {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .footer-sub {
      font-family: 'Century Gothic', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #cbd5e1;
    }
    .footer-hash {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.8px;
      fill: #64748b;
    }
    .footer-pulse {
      animation: footerPulseAnim 1.8s infinite ease-in-out;
    }
    @keyframes footerPulseAnim {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Container Box with Chamfered Corners -->
  <polygon points="18,4 882,4 896,18 896,152 882,166 18,166 4,152 4,18" fill="url(#footerBg)" stroke="url(#footerBorderGrad)" stroke-width="1.3" />

  <!-- Inner Tech Grid -->
  <polygon points="18,4 882,4 896,18 896,152 882,166 18,166 4,152 4,18" fill="url(#footerGrid)" />

  <!-- Left & Right Caution Accent Stripes -->
  <polygon points="4,18 4,45 12,37 12,18" fill="url(#footerCaution)" />
  <polygon points="896,125 896,152 888,152 888,133" fill="url(#footerCaution)" />

  <!-- Sci-Fi Corner Brackets -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 890 14 L 890 26 L 878 26" />
    <path d="M 10 156 L 10 144 L 22 144" />
  </g>

  <!-- Top Status Bar Inside Footer -->
  <g transform="translate(26, 24)">
    <polygon points="0,-10 190,-10 198,6 0,6" fill="#141732" stroke="#00f0ff" stroke-width="0.9" />
    <text x="8" y="2" fill="#00f0ff" class="footer-mono">// SECURE_CHANNEL_TERMINATION</text>

    <!-- Status indicator badge -->
    <polygon points="690,-10 840,-10 848,6 698,6" fill="#0c1d1a" stroke="#00ff66" stroke-width="0.9" />
    <circle cx="704" cy="-2" r="3" fill="#00ff66" class="footer-pulse" />
    <text x="714" y="2" fill="#00ff66" class="footer-mono">DISPATCH: AVAILABLE</text>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="26" y1="44" x2="874" y2="44" stroke="#1f2947" stroke-width="1" />
  <line x1="26" y1="44" x2="216" y2="44" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
  <line x1="710" y1="44" x2="874" y2="44" stroke="#00ff66" stroke-width="1.5" opacity="0.8" />

  <!-- Center Content: Signature & Netrunner Credentials -->
  <g transform="translate(26, 74)">
    <!-- Name and Title -->
    <text x="0" y="0" class="footer-title">
      JUAN CARLOS DORADO LÓPEZ <tspan fill="#00f0ff">//</tspan> <tspan fill="#fcee0a">FULL STACK ARCHITECT</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="22" class="footer-sub">
      Specialized in Reactive Web Systems • Cloud Scalability • Cybernetic UI/UX Engineering
    </text>

    <!-- Right Badge: Neural Link -->
    <g transform="translate(640, -14)">
      <polygon points="0,0 200,0 208,32 8,32" fill="#141732" stroke="#ff0055" stroke-width="1.2" />
      <text x="104" y="14" text-anchor="middle" fill="#ff0055" class="footer-mono">OPEN FOR OPPORTUNITIES</text>
      <text x="104" y="26" text-anchor="middle" fill="#fcee0a" class="footer-mono">REMOTE &amp; HYBRID MISSIONS</text>
    </g>
  </g>

  <!-- Bottom Telemetry & Security Checksum -->
  <g transform="translate(26, 142)">
    <line x1="0" y1="-14" x2="848" y2="-14" stroke="#1f2947" stroke-width="0.8" />

    <!-- Telemetry specs -->
    <text x="0" y="0" class="footer-mono">
      <tspan fill="#00f0ff">SYS_HOST:</tspan> <tspan fill="#cbd5e1">jucagolddev.net</tspan>
      <tspan fill="#64748b"> │ </tspan>
      <tspan fill="#fcee0a">NET_LATENCY:</tspan> <tspan fill="#cbd5e1">12ms</tspan>
      <tspan fill="#64748b"> │ </tspan>
      <tspan fill="#00ff66">PROTOCOL:</tspan> <tspan fill="#cbd5e1">TLS 1.3 / AES-GCM-256</tspan>
      <tspan fill="#64748b"> │ </tspan>
      <tspan fill="#ff0055">CI/CD:</tspan> <tspan fill="#cbd5e1">GH_ACTIONS ACTIVE</tspan>
    </text>

    <!-- Checksum string -->
    <text x="848" y="0" text-anchor="end" class="footer-hash">
      SHA256: 7f8c92a15e3b4d6089... [VERIFIED]
    </text>
  </g>
</svg>