<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141E" />
      <stop offset="100%" stop-color="#141B29" />
    </linearGradient>

    <linearGradient id="topAccentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="88%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <pattern id="microDotsDark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94A3B8" opacity="0.12" />
    </pattern>

    <clipPath id="cardClipDark">
      <rect x="1" y="1" width="898" height="218" rx="14" />
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace;
    }
    .pulse {
      animation: pulseDot 2.4s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Card Surface -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgDark)" stroke="#263042" stroke-width="1" />

  <g clip-path="url(#cardClipDark)">
    <rect x="1" y="1" width="898" height="218" fill="url(#glowCyan)" />
    <rect x="1" y="1" width="898" height="218" fill="url(#glowIndigo)" />
    <rect x="1" y="1" width="898" height="218" fill="url(#microDotsDark)" />
    <line x1="1" y1="1.75" x2="899" y2="1.75" stroke="url(#topAccentDark)" stroke-width="1.5" />
  </g>

  <!-- Top Row -->
  <g transform="translate(36, 23)">
    <rect x="0" y="0" width="272" height="24" rx="12" fill="#111927" stroke="#263042" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#22C55E" class="pulse" />
    <text x="25" y="15.5" fill="#CBD5E1" class="sans" font-size="11" font-weight="500">Disponible para oportunidades · Sevilla, ES</text>
  </g>

  <text x="864" y="39" text-anchor="end" fill="#8B949E" class="mono" font-size="11" font-weight="500">DAW · Ing. Informática (UBU) · @jucagolddev</text>

  <!-- Main Identity -->
  <text x="38" y="102" fill="#F0F6FC" class="sans" font-size="33" font-weight="800" letter-spacing="-0.6">Juan Carlos Dorado López</text>
  <rect x="38" y="112" width="54" height="2.5" rx="1.25" fill="url(#topAccentDark)" />
  <text x="38" y="138" fill="#94A3B8" class="sans" font-size="14.5" font-weight="500">Frontend &amp; Full-Stack Software Engineer · Angular, TypeScript &amp; Clean Architecture</text>

  <!-- Right Isometric 3-Layer Clean Architecture Emblem -->
  <g transform="translate(744, 62)">
    <line x1="58" y1="18" x2="58" y2="76" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2.5,2.5" opacity="0.55" />

    <polygon points="58,4 112,24 58,44 4,24" fill="#162033" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="58" cy="24" r="3" fill="#38BDF8" />

    <polygon points="58,28 112,48 58,68 4,48" fill="#141C2E" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="58" cy="48" r="3" fill="#818CF8" />

    <polygon points="58,52 112,72 58,92 4,72" fill="#131926" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="58" cy="72" r="3" fill="#F59E0B" />
  </g>

  <!-- Bottom Divider -->
  <line x1="36" y1="164" x2="864" y2="164" stroke="#222C3C" stroke-width="1" />

  <!-- Bottom Chips (clean proportional sans font, generous width, zero collision) -->
  <g transform="translate(38, 177)" class="sans" font-size="11" font-weight="600">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="144" height="26" rx="6" fill="#111824" stroke="#263042" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#38BDF8" />
      <text x="22" y="16.5" fill="#E2E8F0">Angular 19+ · Signals</text>
    </g>

    <g transform="translate(154, 0)">
      <rect x="0" y="0" width="122" height="26" rx="6" fill="#111824" stroke="#263042" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#38BDF8" />
      <text x="22" y="16.5" fill="#E2E8F0">TypeScript Strict</text>
    </g>

    <g transform="translate(286, 0)">
      <rect x="0" y="0" width="132" height="26" rx="6" fill="#111824" stroke="#263042" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#818CF8" />
      <text x="22" y="16.5" fill="#E2E8F0">Clean Architecture</text>
    </g>

    <g transform="translate(428, 0)">
      <rect x="0" y="0" width="122" height="26" rx="6" fill="#111824" stroke="#263042" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#F59E0B" />
      <text x="22" y="16.5" fill="#E2E8F0">Three.js · Canvas</text>
    </g>

    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="126" height="26" rx="6" fill="#111824" stroke="#263042" stroke-width="1" />
      <circle cx="12" cy="13" r="2.5" fill="#22C55E" />
      <text x="22" y="16.5" fill="#E2E8F0">Node.js · Firebase</text>
    </g>
  </g>

  <text x="864" y="194" text-anchor="end" fill="#8B949E" class="mono" font-size="11" font-weight="600">60 FPS · ES / EN</text>
</svg>
