<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="100%" height="56">
  <defs>
    <linearGradient id="headBgActiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180e28" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0c0818" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="laserBarActiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="35%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlowActiv" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="headGridActiv" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#ff0055" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #ffffff;
    }
    .meta-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00f0ff;
    }
    .pulse-dot {
      animation: pulseActiv 1.8s infinite ease-in-out;
    }
    @keyframes pulseActiv {
      0% { opacity: 0.3; }
      50% { opacity: 0.3; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Outer Chamfered Container -->
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headBgActiv)" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.45" />
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headGridActiv)" />

  <!-- Bottom Accent Laser Line -->
  <line x1="6" y1="50" x2="880" y2="50" stroke="url(#laserBarActiv)" stroke-width="2.5" filter="url(#laserGlowActiv)" />

  <!-- Magenta Index Tag Box with Chamfered Edge -->
  <polygon points="14,12 178,12 190,44 14,44" fill="#ff0055" />
  <text x="24" y="32" class="tag-hud">NEURAL_GRID // 05</text>

  <!-- Isometric 3D Cube Icon -->
  <g transform="translate(208, 17)" stroke="#00f0ff" stroke-width="1.6" fill="none">
    <path d="M 10 2 L 18 6 L 18 16 L 10 20 L 2 16 L 2 6 Z" stroke="#00f0ff" />
    <line x1="10" y1="2" x2="10" y2="11" stroke="#fcee0a" />
    <line x1="10" y1="11" x2="18" y2="6" stroke="#fcee0a" />
    <line x1="10" y1="11" x2="2" y2="6" stroke="#fcee0a" />
  </g>

  <!-- Main Section Title -->
  <text x="246" y="33" class="title-hud">ACTIVIDAD ISOMÉTRICA 3D &amp; COMMITS</text>

  <!-- Right Meta Telemetry Tag with Glowing Dot -->
  <text x="800" y="32" class="meta-hud" text-anchor="end">// 3D_MATRIX</text>
  <circle cx="816" cy="28" r="3.5" fill="#00f0ff" class="pulse-dot" />
</svg>
