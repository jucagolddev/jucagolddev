<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="100%" height="52">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1020" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#070812" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="headLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="85%" stop-color="#fcee0a" />
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0" />
    </linearGradient>

    <filter id="headGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', 'Fira Code', 'Courier New', monospace, sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #ffffff;
    }
    .meta-hud {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #00f0ff;
    }
  </style>

  <!-- Background Ribbon with Angled End -->
  <polygon points="5,4 780,4 820,48 5,48" fill="url(#headBg)" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Accent Bottom Cyber Bar -->
  <line x1="5" y1="48" x2="840" y2="48" stroke="url(#headLineGrad)" stroke-width="2.5" filter="url(#headGlow)" />

  <!-- Neon Magenta Index Tag Box -->
  <polygon points="12,12 175,12 185,40 12,40" fill="#ff0055" />
  <text x="22" y="29" class="tag-hud">NEURAL_GRID // 05</text>

  <!-- Vector Icon: Isometric 3D Cube / Matrix Grid -->
  <g transform="translate(202, 16)" stroke="#00f0ff" stroke-width="1.6" fill="none">
    <path d="M 10 2 L 18 6 L 18 16 L 10 20 L 2 16 L 2 6 Z" stroke="#00f0ff" />
    <line x1="10" y1="2" x2="10" y2="11" stroke="#fcee0a" />
    <line x1="10" y1="11" x2="18" y2="6" stroke="#fcee0a" />
    <line x1="10" y1="11" x2="2" y2="6" stroke="#fcee0a" />
  </g>

  <!-- Title Text -->
  <text x="238" y="30" class="title-hud">ACTIVIDAD ISOMÉTRICA 3D &amp; COMMITS</text>

  <!-- Right Meta Telemetry Tag -->
  <text x="750" y="30" class="meta-hud" text-anchor="end">// 3D_MATRIX_MAPPING</text>
  <circle cx="765" cy="26" r="3.5" fill="#00f0ff" />
</svg>

