<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="100%" height="56">
  <defs>
    <linearGradient id="headBgTelem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141424" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0a0a16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="laserBarTelem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="40%" stop-color="#00f0ff" />
      <stop offset="80%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlowTelem" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="headGridTelem" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#fcee0a" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #05050b;
    }
    .meta-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #fcee0a;
    }
    .pulse-dot {
      animation: pulseTelem 1.8s infinite ease-in-out;
    }
    @keyframes pulseTelem {
      0% { opacity: 0.3; }
      50% { opacity: 0.3; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Outer Chamfered Container -->
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headBgTelem)" stroke="#fcee0a" stroke-width="1.2" stroke-opacity="0.45" />
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headGridTelem)" />

  <!-- Bottom Accent Laser Line -->
  <line x1="6" y1="50" x2="880" y2="50" stroke="url(#laserBarTelem)" stroke-width="2.5" filter="url(#laserGlowTelem)" />

  <!-- Yellow Index Tag Box with Chamfered Edge -->
  <polygon points="14,12 165,12 177,44 14,44" fill="#fcee0a" />
  <text x="24" y="32" class="tag-hud">TELEMETRY // 04</text>

  <!-- Oscilloscope Vector Icon -->
  <g transform="translate(196, 17)" stroke="#00f0ff" stroke-width="1.8" fill="none">
    <path d="M 1 12 L 5 12 L 8 4 L 12 20 L 15 10 L 18 14 L 22 12" />
    <circle cx="12" cy="20" r="1.5" fill="#fcee0a" />
  </g>

  <!-- Main Section Title -->
  <text x="234" y="33" class="title-hud">TELEMETRÍA &amp; RENDIMIENTO EN GITHUB</text>

  <!-- Right Meta Telemetry Tag with Glowing Dot -->
  <text x="800" y="32" class="meta-hud" text-anchor="end">// REAL_TIME_METRICS</text>
  <circle cx="816" cy="28" r="3.5" fill="#fcee0a" class="pulse-dot" />
</svg>
