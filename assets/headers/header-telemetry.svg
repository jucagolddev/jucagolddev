<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="100%" height="52">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1020" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#070812" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="headLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="40%" stop-color="#ff0055" />
      <stop offset="85%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="headGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', 'Fira Code', 'Courier New', monospace, sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #05050b;
    }
    .meta-hud {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #ff0055;
    }
  </style>

  <!-- Background Ribbon with Angled End -->
  <polygon points="5,4 780,4 820,48 5,48" fill="url(#headBg)" stroke="#fcee0a" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Accent Bottom Cyber Bar -->
  <line x1="5" y1="48" x2="840" y2="48" stroke="url(#headLineGrad)" stroke-width="2.5" filter="url(#headGlow)" />

  <!-- Yellow Index Tag Box -->
  <polygon points="12,12 165,12 175,40 12,40" fill="#fcee0a" />
  <text x="22" y="29" class="tag-hud">TELEMETRY // 04</text>

  <!-- Vector Icon: Telemetry Radar / Oscilloscope -->
  <g transform="translate(192, 16)" stroke="#00f0ff" stroke-width="1.8" fill="none">
    <path d="M 1 12 L 5 12 L 8 4 L 12 20 L 15 10 L 18 14 L 22 12" />
    <circle cx="12" cy="20" r="1.5" fill="#fcee0a" />
  </g>

  <!-- Title Text -->
  <text x="230" y="30" class="title-hud">TELEMETRÍA &amp; RENDIMIENTO EN GITHUB</text>

  <!-- Right Meta Telemetry Tag -->
  <text x="750" y="30" class="meta-hud" text-anchor="end">// REAL_TIME_METRICS</text>
  <circle cx="765" cy="26" r="3.5" fill="#fcee0a" />
</svg>

