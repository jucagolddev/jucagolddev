<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="100%" height="52">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1020" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#070812" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="headLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="45%" stop-color="#00f0ff" />
      <stop offset="85%" stop-color="#fcee0a" />
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="0" />
    </linearGradient>

    <filter id="headGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', 'Fira Code', 'Courier New', monospace, sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #ffffff;
    }
    .meta-hud {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #fcee0a;
    }
  </style>

  <!-- Background Ribbon with Angled End -->
  <polygon points="5,4 780,4 820,48 5,48" fill="url(#headBg)" stroke="#ff0055" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Accent Bottom Cyber Bar -->
  <line x1="5" y1="48" x2="840" y2="48" stroke="url(#headLineGrad)" stroke-width="2.5" filter="url(#headGlow)" />

  <!-- Magenta Index Tag Box -->
  <polygon points="12,12 165,12 175,40 12,40" fill="#ff0055" />
  <text x="22" y="29" class="tag-hud">ARSENAL // 02</text>

  <!-- Vector Icon: Microprocessor / Chip -->
  <g transform="translate(192, 16)" stroke="#00f0ff" stroke-width="1.6" fill="none">
    <rect x="3" y="3" width="16" height="16" rx="2" />
    <circle cx="11" cy="11" r="3" fill="#fcee0a" />
    <line x1="11" y1="0" x2="11" y2="3" />
    <line x1="11" y1="19" x2="11" y2="22" />
    <line x1="0" y1="11" x2="3" y2="11" />
    <line x1="19" y1="11" x2="22" y2="11" />
  </g>

  <!-- Title Text -->
  <text x="230" y="30" class="title-hud">STACK TECNOLÓGICO &amp; ARQUITECTURA</text>

  <!-- Right Meta Telemetry Tag -->
  <text x="750" y="30" class="meta-hud" text-anchor="end">// CORE_MODULES_LOADED</text>
  <circle cx="765" cy="26" r="3.5" fill="#fcee0a" />
</svg>
