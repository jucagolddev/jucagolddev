<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="100%" height="56">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headBgAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1226" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#090a16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#04050a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Bottom Laser Bar -->
    <linearGradient id="laserBarAbout" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="laserGlowAbout" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle HUD Grid -->
    <pattern id="headGridAbout" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #05050b;
    }
    .meta-hud {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00f0ff;
    }
    .pulse-dot {
      animation: pulseAbout 1.8s infinite ease-in-out;
    }
    @keyframes pulseAbout {
      0% { opacity: 0.3; }
      50% { opacity: 0.3; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Outer Chamfered Container -->
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headBgAbout)" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.45" />
  <polygon points="6,6 840,6 876,50 6,50" fill="url(#headGridAbout)" />

  <!-- Bottom Accent Laser Line -->
  <line x1="6" y1="50" x2="880" y2="50" stroke="url(#laserBarAbout)" stroke-width="2.5" filter="url(#laserGlowAbout)" />

  <!-- Yellow Index Tag Box with Chamfered Edge -->
  <polygon points="14,12 152,12 164,44 14,44" fill="#fcee0a" />
  <text x="24" y="32" class="tag-hud">SYS_BIO // 01</text>

  <!-- Terminal HUD Vector Icon -->
  <g transform="translate(182, 17)" stroke="#00f0ff" stroke-width="1.8" fill="none">
    <rect x="0" y="0" width="22" height="18" rx="2" />
    <path d="M 4 6 L 8 9 L 4 12" stroke="#ff0055" />
    <line x1="11" y1="12" x2="16" y2="12" stroke="#fcee0a" />
  </g>

  <!-- Main Section Title -->
  <text x="220" y="33" class="title-hud">SOBRE MÍ &amp; ENFOQUE TÉCNICO</text>

  <!-- Right Meta Telemetry Tag with Glowing Dot -->
  <text x="800" y="32" class="meta-hud" text-anchor="end">// PROFILE_INITIALIZED</text>
  <circle cx="816" cy="28" r="3.5" fill="#00f0ff" class="pulse-dot" />
</svg>
