<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="100%" height="52">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1020" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#070812" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05050b" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="headLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" />
      <stop offset="45%" stop-color="#00f0ff" />
      <stop offset="85%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>

    <filter id="headGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-hud {
      font-family: 'Orbitron', 'Rajdhani', 'Fira Code', 'Courier New', monospace, sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2.5px;
      fill: #ffffff;
    }
    .tag-hud {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #05050b;
    }
    .meta-hud {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #fcee0a;
    }
  </style>

  <!-- Background Ribbon with Angled End -->
  <polygon points="5,4 780,4 820,48 5,48" fill="url(#headBg)" stroke="#fcee0a" stroke-width="0.8" stroke-opacity="0.3" />

  <!-- Accent Bottom Cyber Bar -->
  <line x1="5" y1="48" x2="840" y2="48" stroke="url(#headLineGrad)" stroke-width="2.5" filter="url(#headGlow)" />

  <!-- Yellow Index Tag Box -->
  <polygon points="12,12 175,12 185,40 12,40" fill="#fcee0a" />
  <text x="22" y="29" class="tag-hud">RUNNER // 06</text>

  <!-- Vector Icon: Snake / Circuit Worm -->
  <g transform="translate(202, 16)" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 2 16 L 8 16 L 8 6 L 14 6 L 14 16 L 20 16" />
    <circle cx="20" cy="16" r="2" fill="#ff0055" stroke="none" />
  </g>

  <!-- Title Text -->
  <text x="238" y="30" class="title-hud">AUTÓMATA SNAKE RECORRIENDO COMMITS</text>

  <!-- Right Meta Telemetry Tag -->
  <text x="750" y="30" class="meta-hud" text-anchor="end">// CRON_AUTOMATION_ACTIVE</text>
  <circle cx="765" cy="26" r="3.5" fill="#fcee0a" />
</svg>
