<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" from="0%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Glow Line -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 2.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .dot-pulse {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.3; r: 3; }
      50% { opacity: 1; r: 4.5; }
      100% { opacity: 0.3; r: 3; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Grid Overlay -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.07" filter="url(#neonGlow)" />
  <circle cx="750" cy="140" r="140" fill="#818cf8" opacity="0.08" filter="url(#neonGlow)" />

  <!-- Status Indicator: Available for work -->
  <g transform="translate(450, 42)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.6" />
    <circle cx="-118" cy="0" r="4" fill="#22c55e" class="dot-pulse" />
    <text x="-106" y="4" fill="#86efac" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1">ESTUDIANTE DE ING. INFORMÁTICA</text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(450, 105)">
    <!-- Subtle Drop Shadow -->
    <text x="0" y="3" text-anchor="middle" fill="#030712" opacity="0.8" class="title-text">JUAN CARLOS DORADO</text>
    <!-- Glowing Main Text -->
    <text x="0" y="0" text-anchor="middle" fill="url(#textGradient)" class="title-text">JUAN CARLOS DORADO</text>
  </g>

  <!-- Subtitle / Title -->
  <g transform="translate(450, 142)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" class="subtitle-text">
      DESARROLLADOR WEB &bull; FRONTEND ARCHITECT &bull; FULL-STACK
    </text>
  </g>

  <!-- Tech Pillars Pills -->
  <g transform="translate(450, 192)">
    <!-- Angular -->
    <g transform="translate(-250, 0)">
      <rect x="-48" y="-14" width="96" height="28" rx="14" fill="url(#pillGrad)" stroke="#dd0031" stroke-width="1" stroke-opacity="0.7" />
      <text x="0" y="4" text-anchor="middle" fill="#fca5a5" class="badge-text">⚡ ANGULAR</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(-125, 0)">
      <rect x="-56" y="-14" width="112" height="28" rx="14" fill="url(#pillGrad)" stroke="#3178c6" stroke-width="1" stroke-opacity="0.7" />
      <text x="0" y="4" text-anchor="middle" fill="#93c5fd" class="badge-text">📘 TYPESCRIPT</text>
    </g>

    <!-- Signals & RxJS -->
    <g transform="translate(8, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.7" />
      <text x="0" y="4" text-anchor="middle" fill="#d8b4fe" class="badge-text">🔮 SIGNALS &amp; RXJS</text>
    </g>

    <!-- Firebase -->
    <g transform="translate(142, 0)">
      <rect x="-52" y="-14" width="104" height="28" rx="14" fill="url(#pillGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.7" />
      <text x="0" y="4" text-anchor="middle" fill="#fde68a" class="badge-text">🔥 FIREBASE</text>
    </g>

    <!-- Tailwind -->
    <g transform="translate(255, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="url(#pillGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.7" />
      <text x="0" y="4" text-anchor="middle" fill="#67e8f9" class="badge-text">🌊 TAILWIND</text>
    </g>
  </g>
</svg>
