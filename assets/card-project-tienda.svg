<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="260">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardTiendaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f" />
      <stop offset="50%" stop-color="#090b1e" />
      <stop offset="100%" stop-color="#0e1028" />
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="tiendaBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9" />
    </linearGradient>

    <!-- Chip Background -->
    <linearGradient id="chipBgTienda" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12152e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080a18" stop-opacity="0.9" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="cardGridTienda" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlowTienda" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: 'Century Gothic', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .card-subtitle {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #00f0ff;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      line-height: 1.5;
      fill: #cbd5e1;
    }
    .card-meta {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .chip-label {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .btn-text {
      font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      fill: #00f0ff;
    }
    .pulse-dot {
      animation: pulseTienda 1.8s infinite ease-in-out;
    }
    @keyframes pulseTienda {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Container Box with Chamfered Corners -->
  <polygon points="16,6 424,6 434,16 434,244 424,254 16,254 6,244 6,16" fill="url(#cardTiendaBg)" stroke="url(#tiendaBorderGrad)" stroke-width="1.3" />

  <!-- Inner Cyber Grid -->
  <polygon points="16,6 424,6 434,16 434,244 424,254 16,254 6,244 6,16" fill="url(#cardGridTienda)" />

  <!-- Top HUD Ribbon -->
  <g transform="translate(18, 22)">
    <!-- Category Pill -->
    <polygon points="0,-10 122,-10 130,8 0,8" fill="#00f0ff" />
    <text x="8" y="3" fill="#05060f" class="card-meta" font-weight="800">MISSION // OPS_01</text>

    <!-- Status Beacon -->
    <circle cx="388" cy="-1" r="3.5" fill="#00ff66" class="pulse-dot" />
    <text x="378" y="2.5" text-anchor="end" fill="#00ff66" class="card-meta">STATUS: PUBLIC_REPO</text>
  </g>

  <!-- Title & Subtitle Group -->
  <g transform="translate(24, 62)">
    <!-- Cart Icon in Cyan Square -->
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#0c1228" stroke="#00f0ff" stroke-width="1" />
    <g transform="translate(5, 5)" stroke="#00f0ff" stroke-width="1.5" fill="none">
      <path d="M 1 2 L 4 2 L 7 13 L 17 13 L 19 5 L 5 5" />
      <circle cx="8" cy="16" r="1.5" fill="#fcee0a" stroke="none" />
      <circle cx="16" cy="16" r="1.5" fill="#fcee0a" stroke="none" />
    </g>

    <!-- Title Texts -->
    <text x="40" y="14" class="card-title">TIENDA ONLINE // API REST</text>
    <text x="40" y="27" class="card-subtitle">PCCOMPONENTES FLOW ARCHITECTURE</text>
  </g>

  <!-- Description Body -->
  <g transform="translate(24, 114)">
    <text x="0" y="0" class="card-desc">
      <tspan x="0" dy="0">Aplicación web completa con catálogo interactivo y carrito</tspan>
      <tspan x="0" dy="16">persistente mediante LocalStorage. Consumo de API RESTful</tspan>
      <tspan x="0" dy="16">personalizada y almacenamiento en base de datos PHP / MySQL.</tspan>
    </text>
  </g>

  <!-- Tech Chips Group -->
  <g transform="translate(24, 182)">
    <!-- Chip 1: JS -->
    <g transform="translate(0, 0)">
      <polygon points="-4,-10 92,-10 98,10 -4,10" fill="url(#chipBgTienda)" stroke="#fcee0a" stroke-width="0.9" />
      <circle cx="6" cy="0" r="2.5" fill="#fcee0a" />
      <text x="14" y="3" fill="#fef08a" class="chip-label">JAVASCRIPT</text>
    </g>

    <!-- Chip 2: PHP -->
    <g transform="translate(108, 0)">
      <polygon points="-4,-10 96,-10 102,10 -4,10" fill="url(#chipBgTienda)" stroke="#ff0055" stroke-width="0.9" />
      <circle cx="6" cy="0" r="2.5" fill="#ff0055" />
      <text x="14" y="3" fill="#fda4af" class="chip-label">PHP REST API</text>
    </g>

    <!-- Chip 3: MySQL -->
    <g transform="translate(216, 0)">
      <polygon points="-4,-10 76,-10 82,10 -4,10" fill="url(#chipBgTienda)" stroke="#00f0ff" stroke-width="0.9" />
      <circle cx="6" cy="0" r="2.5" fill="#00f0ff" />
      <text x="14" y="3" fill="#a5f3fc" class="chip-label">MYSQL DB</text>
    </g>
  </g>

  <!-- Bottom Action Button Pill -->
  <g transform="translate(24, 226)">
    <polygon points="0,-12 384,-12 392,12 8,12" fill="#080a1c" stroke="#00f0ff" stroke-width="1.2" filter="url(#neonGlowTienda)" />
    <text x="196" y="4" text-anchor="middle" class="btn-text">
      [ ⌥ EXPLORE_SOURCE // GITHUB REPOSITORY → ]
    </text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#ff0055" stroke-width="1.3" fill="none" opacity="0.75">
    <path d="M 10 24 L 10 12 L 22 12" />
    <path d="M 430 236 L 430 248 L 418 248" />
  </g>
</svg>
