<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <!-- Left Cyberpunk Beam Gradient -->
    <linearGradient id="cyberBeamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="1" />
    </linearGradient>

    <!-- Right Cyberpunk Beam Gradient -->
    <linearGradient id="cyberBeamRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="1" />
      <stop offset="15%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Laser Line -->
  <line x1="20" y1="10" x2="425" y2="10" stroke="url(#cyberBeamLeft)" stroke-width="2" filter="url(#laserGlow)" stroke-linecap="round" />
  
  <!-- Right Laser Line -->
  <line x1="475" y1="10" x2="880" y2="10" stroke="url(#cyberBeamRight)" stroke-width="2" filter="url(#laserGlow)" stroke-linecap="round" />

  <!-- Center HUD Diamond Emitter -->
  <g transform="translate(450, 10)">
    <!-- Outer Cyan Reticle -->
    <polygon points="0,-8 16,0 0,8 -16,0" fill="#05050b" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Inner Cyber Yellow Core -->
    <polygon points="0,-4 8,0 0,4 -8,0" fill="#fcee0a" filter="url(#laserGlow)" />
    <!-- Magenta Accent Flanks -->
    <line x1="-26" y1="-5" x2="-21" y2="-5" stroke="#ff0055" stroke-width="1.5" />
    <line x1="-26" y1="5" x2="-21" y2="5" stroke="#ff0055" stroke-width="1.5" />
    <line x1="26" y1="-5" x2="21" y2="-5" stroke="#ff0055" stroke-width="1.5" />
    <line x1="26" y1="5" x2="21" y2="5" stroke="#ff0055" stroke-width="1.5" />
  </g>
</svg>
