<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <!-- Left Gradient Beam -->
    <linearGradient id="divBeamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="90%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fcee0a" stop-opacity="1" />
    </linearGradient>

    <!-- Right Gradient Beam -->
    <linearGradient id="divBeamRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcee0a" stop-opacity="1" />
      <stop offset="10%" stop-color="#ff0055" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#7928ca" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .div-tick { stroke: #00f0ff; stroke-width: 1; opacity: 0.35; }
    .pulse-core { animation: divPulse 2.2s infinite ease-in-out; }
    @keyframes divPulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.3; }
      100% { opacity: 0.3; }
    }
  </style>

  <!-- Telemetry Tick Marks (Left) -->
  <line x1="80" y1="9" x2="80" y2="15" class="div-tick" />
  <line x1="160" y1="10" x2="160" y2="14" class="div-tick" />
  <line x1="240" y1="9" x2="240" y2="15" class="div-tick" />
  <line x1="320" y1="10" x2="320" y2="14" class="div-tick" />
  <line x1="390" y1="8" x2="390" y2="16" stroke="#ff0055" stroke-width="1.2" opacity="0.6" />

  <!-- Left Main Laser Beam -->
  <line x1="30" y1="12" x2="422" y2="12" stroke="url(#divBeamLeft)" stroke-width="1.8" filter="url(#divGlow)" />
  <!-- Left Inner White-Hot Line -->
  <line x1="280" y1="12" x2="422" y2="12" stroke="#ffffff" stroke-width="0.8" opacity="0.75" />

  <!-- Telemetry Tick Marks (Right) -->
  <line x1="510" y1="8" x2="510" y2="16" stroke="#ff0055" stroke-width="1.2" opacity="0.6" />
  <line x1="580" y1="10" x2="580" y2="14" class="div-tick" />
  <line x1="660" y1="9" x2="660" y2="15" class="div-tick" />
  <line x1="740" y1="10" x2="740" y2="14" class="div-tick" />
  <line x1="820" y1="9" x2="820" y2="15" class="div-tick" />

  <!-- Right Main Laser Beam -->
  <line x1="478" y1="12" x2="870" y2="12" stroke="url(#divBeamRight)" stroke-width="1.8" filter="url(#divGlow)" />
  <!-- Right Inner White-Hot Line -->
  <line x1="478" y1="12" x2="620" y2="12" stroke="#ffffff" stroke-width="0.8" opacity="0.75" />

  <!-- Center HUD Diamond & Reticle Emitter -->
  <g transform="translate(450, 12)">
    <!-- Outer Cyan HUD Diamond -->
    <polygon points="0,-10 18,0 0,10 -18,0" fill="#05050b" stroke="#00f0ff" stroke-width="1.2" />
    <!-- Secondary Magenta Offset Diamond -->
    <polygon points="0,-7 13,0 0,7 -13,0" fill="none" stroke="#ff0055" stroke-width="0.9" opacity="0.85" />
    <!-- Center Glowing Cyber-Yellow Core -->
    <polygon points="0,-4 7,0 0,4 -7,0" fill="#fcee0a" filter="url(#divGlow)" class="pulse-core" />
    
    <!-- Outer Flanking Circuit Brackets -->
    <path d="M -26 -6 L -22 -6 L -22 6 L -26 6" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.8" />
    <path d="M 26 -6 L 22 -6 L 22 6 L 26 6" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.8" />
    
    <!-- Micro Dots -->
    <circle cx="-32" cy="0" r="1.5" fill="#fcee0a" />
    <circle cx="32" cy="0" r="1.5" fill="#fcee0a" />
  </g>
</svg>
